<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        .image-container {
            margin-bottom: 30px;
        }
        .image-container img {
            max-width: 100%;
            display: block;
            margin: 0 auto;
            border: 1px solid #ddd;
        }
        h2 {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Photography Portfolio Image Test</h1>
    
    <div class="image-container">
        <h2>Hero Image</h2>
        <img src="images/hero.jpg" alt="Hero Image">
    </div>
    
    <div class="image-container">
        <h2>Photographer Image</h2>
        <img src="images/photographer.jpg" alt="Photographer">
    </div>
    
    <h2>Portfolio Images</h2>
    <div class="image-container">
        <h3>Nature Images</h3>
        <img src="images/nature1.jpg" alt="Nature 1">
        <img src="images/nature2.jpg" alt="Nature 2">
    </div>
    
    <div class="image-container">
        <h3>Portrait Images</h3>
        <img src="images/portrait1.jpg" alt="Portrait 1">
        <img src="images/portrait2.jpg" alt="Portrait 2">
    </div>
    
    <div class="image-container">
        <h3>Wedding Images</h3>
        <img src="images/wedding1.jpg" alt="Wedding 1">
        <img src="images/wedding2.jpg" alt="Wedding 2">
    </div>
    
    <div class="image-container">
        <h3>Travel Images</h3>
        <img src="images/travel1.jpg" alt="Travel 1">
        <img src="images/travel2.jpg" alt="Travel 2">
    </div>
</body>
</html>
